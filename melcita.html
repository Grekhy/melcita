<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para mi Melcita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. VARIABLES DE DISEÑO
   Paleta: https://coolors.co/palette/b28dff-bc98ff-c5a3ff-d1b1ff-d7b8ff-dcbfff-e3c7ff-e9cfff-f2daff-fbe4ff
   Para cambiar colores, editá solo este bloque.
   ========================================================= */
:root {
  --p1: #b28dff;  --p2: #bc98ff;  --p3: #c5a3ff;  --p4: #d1b1ff;  --p5: #d7b8ff;
  --p6: #dcbfff;  --p7: #e3c7ff;  --p8: #e9cfff;  --p9: #f2daff;  --p10: #fbe4ff;

  --ink: #3a2268;        /* Texto principal (violeta muy oscuro, buen contraste) */
  --ink-soft: #6a4fa3;   /* Texto secundario */
  --seal: #8a5cf0;       /* Sello de lacre */

  --font-title: "Fraunces", Georgia, serif;
  --font-hand: "Caveat", "Segoe Print", cursive;

  /* Tamaño del sobre: todo lo demás se calcula a partir del ancho */
  --w: 190px;
  --h: calc(var(--w) * 0.663);
  --gap: 20px;
}

/* Pantallas medianas: 4 columnas que se achican según el ancho disponible */
@media (max-width: 899px) {
  :root { --w: min(190px, calc((100vw - 40px - 3 * var(--gap)) / 4)); }
}

/* Celular: 2 columnas */
@media (max-width: 699px) {
  :root {
    --gap: 28px;  /* Separación horizontal entre sobres */
    /* Ancho = (pantalla - márgenes laterales de 14px a cada lado - separación) / 2 */
    --w: min(220px, calc((100vw - 28px - var(--gap)) / 2));
  }
}

/* =========================================================
   2. BASE
   ========================================================= */
* { box-sizing: border-box; margin: 0; }

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 48px 20px;
  color: var(--ink);
  font-family: var(--font-title);
  background: linear-gradient(160deg, var(--p10) 0%, var(--p8) 45%, var(--p5) 100%);
  background-attachment: fixed;
}

main { width: min(960px, 100%); text-align: center; }

h1 {
  font-size: clamp(1.9rem, 6vw, 3.2rem);
  font-weight: 600;
  letter-spacing: -0.01em;
}

.subtitle {
  margin: 10px auto 0;
  max-width: 44ch;
  color: var(--ink-soft);
  font-size: clamp(.95rem, 2.6vw, 1.05rem);
  line-height: 1.5;
}

/* =========================================================
   3. CARTAS (SOBRES)
   ========================================================= */
.grid {
  display: grid;
  grid-template-columns: repeat(4, var(--w));
  justify-content: center;
  column-gap: var(--gap);
  /* Espacio reservado para la solapa abierta (sobresale la mitad del alto del sobre) */
  row-gap: calc(var(--h) * 0.5 + 30px);
  padding-top: calc(var(--h) * 0.5 + 40px);
}

@media (max-width: 699px) {
  body { padding: 40px 14px; }  /* Menos margen lateral para que los sobres ocupen más ancho */
  .grid {
    grid-template-columns: repeat(2, var(--w));
    row-gap: calc(var(--h) * 0.5 + 40px);  /* Más aire entre filas */
  }
}

.envelope {
  position: relative;
  width: var(--w);
  height: var(--h);
  padding: 0;
  border: 0;
  cursor: pointer;
  background: none;
  perspective: 600px;
  transition: transform .25s ease, opacity .3s ease;
}
.envelope:hover { transform: translateY(-6px) rotate(-1.5deg); }
.envelope:nth-child(even):hover { transform: translateY(-6px) rotate(1.5deg); }
.envelope:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; border-radius: 8px; }

/* Cuerpo del sobre */
.envelope .body {
  position: absolute; inset: 0;
  border-radius: 8px;
  background:
    linear-gradient(to top right, transparent 49.5%, rgba(58,34,104,.12) 50%, transparent 50.6%) left / 50% 100% no-repeat,
    linear-gradient(to top left,  transparent 49.5%, rgba(58,34,104,.12) 50%, transparent 50.6%) right / 50% 100% no-repeat,
    linear-gradient(180deg, var(--p4), var(--p2));
  box-shadow: 0 10px 22px -10px rgba(58,34,104,.45);
}

/* Papel que asoma al abrir */
.envelope .paper {
  position: absolute; left: 6%; right: 6%; top: 8%; height: 76%;
  background: var(--p10);
  border-radius: 4px;
  transition: transform .5s ease;
  z-index: 1;
}

/* Solapa */
.envelope .flap {
  position: absolute; left: 0; right: 0; top: 0; height: 50%;
  background: linear-gradient(180deg, var(--p6), var(--p3));
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform .5s ease;
  z-index: 3;
}

/* Sello */
.envelope .seal {
  position: absolute; left: 50%; top: 41%;
  width: 16%; aspect-ratio: 1; transform: translateX(-50%);
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--seal);
  color: var(--p10);
  font-size: calc(var(--w) * 0.075);
  box-shadow: 0 2px 6px rgba(58,34,104,.4);
  transition: opacity .2s ease;
  z-index: 4;
}

/* Estado: carta abierta (la solapa queda detrás del papel) */
.envelope.is-open .flap { transform: rotateX(180deg); z-index: 0; }
.envelope.is-open .seal { opacity: 0; }
.envelope.is-open .paper { transform: translateY(-30%); }
.envelope.is-read { opacity: .72; }

/* =========================================================
   4. VENTANA DE LA CARTA
   ========================================================= */
.overlay {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: 16px;
  background: rgba(58,34,104,.45);
  backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
  z-index: 10;
}
.overlay.is-visible { opacity: 1; pointer-events: auto; }

.letter {
  width: min(520px, 100%);
  max-height: 86vh;
  overflow-y: auto;
  padding: 40px 32px 28px;
  background: var(--p10);
  border-radius: 6px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.45);
  text-align: left;
  transform: translateY(40px) rotate(-1deg);
  transition: transform .45s cubic-bezier(.2,.8,.2,1);
  /* Renglones sutiles de hoja de carta */
  background-image: repeating-linear-gradient(transparent 0 35px, rgba(178,141,255,.28) 35px 36px);
  background-position: 0 40px;
}
.overlay.is-visible .letter { transform: none; }

.letter h2 { font-size: 1.4rem; margin-bottom: 18px; }
.letter p {
  font-family: var(--font-hand);
  font-size: 1.6rem;
  line-height: 36px;           /* Debe coincidir con los renglones del fondo */
  white-space: pre-line;       /* Respeta los saltos de línea (\n) del texto */
}
.letter .signature {
  margin-top: 18px;
  text-align: right;
  color: var(--ink-soft);
}

@media (max-width: 480px) {
  .letter { padding: 32px 22px 22px; }
  .letter p { font-size: 1.45rem; }
}

.actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px; }
.btn {
  padding: 10px 22px;
  border: 0; border-radius: 999px;
  background: var(--seal); color: #fff;
  font: 600 1rem var(--font-title);
  cursor: pointer;
  transition: filter .2s ease;
}
.btn:hover { filter: brightness(1.1); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Mensaje cuando ya se leyeron todas */
.done { margin-top: 40px; min-height: 1.5em; color: var(--ink-soft); font-size: 1.05rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}
</style>
</head>

<body>
<main>
  <h1 id="title"></h1>
  <p class="subtitle" id="subtitle"></p>
  <div class="grid" id="grid"></div>
  <p class="done" id="done" aria-live="polite"></p>
</main>

<!-- Ventana emergente con el mensaje -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="letter-title">
  <article class="letter">
    <h2 id="letter-title"></h2>
    <p id="letter-text"></p>
    <p class="signature" id="letter-signature"></p>
    <div class="actions"><button class="btn" id="close-btn"></button></div>
  </article>
</div>

<script>
/* =========================================================
   ★ CONFIGURACIÓN — ACÁ CAMBIÁS TODO ★
   Todo lo que aparece en el sitio sale de este bloque.
   No hace falta tocar nada más abajo.
   ========================================================= */
const CONFIG = {

  /* ---------- Textos generales de la página ---------- */
  texts: {
    pageTitle:  "Para mi Melcita 💜",
    subtitle:   "Elegí una carta. Cada una tiene algo que quiero decirte.",
    closeButton: "Cerrar",
    allRead:    "Ya leíste todo… pero siempre va haber algo más que te quiera decir, no me van alcanzar las palabras para decirte cuánto te amo y todo lo que te quiero dar 💜",
    signature:  "— Tu Benjamino",   // Firma al final de cada carta ("" para ocultarla)
    sealSymbol: "♥",                       // Símbolo del sello del sobre
    envelopeLabel: "Abrir carta"           // Texto para lectores de pantalla
  },

  /* ---------- Opciones de comportamiento ---------- */
  options: {
    // Cantidad de sobres que se muestran. Si es mayor que la cantidad de
    // mensajes, se usa la cantidad de mensajes (no hay sobres vacíos).
    envelopeCount: 8,

    // true  = no se repite un mensaje hasta haber mostrado todos.
    // false = cada carta elige un mensaje al azar, pudiendo repetirse.
    avoidRepeats: true
  },

  /* ---------- Mensajes ----------
     Agregá, borrá o editá libremente. Cada mensaje tiene:
       title: título de la carta (opcional, podés dejarlo en "")
       text:  el mensaje. Usá \n para saltos de línea.
     El orden acá no importa: se elige uno al azar al abrir cada carta. */
  messages: [
    { title: "Tulipán",
      text:  "Quiero que sepas que mi cariño nunca se marchitará.\nPor eso elegí este tulipán de tu color favorito: para que cada vez que lo mires, recuerdes el amor que siento por vos." },

    { title: "Broche",
      text:  "El broche sostiene tu precioso pelo, pero vos sostenés mi mundo, no lo olvides Melcita.\nMe cautiva el brillo y el encanto de tu pelo, es tan hermoso, me pierdo en tanta belleza..." },

    { title: "Espejo",
      text:  "Lo elegí en violeta, sí, porque te gusta y tiene una forma de espejo, pero en realidad es un pretexto para decirte cuánto te amo y lo hermosa que sos <3." },

    { title: "Lapiceras",
      text:  "Acordate de que acá tenés a alguien que cree en vos y te admira con todo lo que te esforzas, me encantaría que las utilices, te adoro." },

    { title: "Marcapáginas",
      text:  "Espero que te guste, a mí me pareció muy bonito y tenía que regalartelo. En algún momento te va a servir, así no te perdés en todos los libros que vas a leer, la mayoría manhwas seguro, mi linda fujoshi." },

    { title: "Naruto",
      text:  "Sabía que querías un peluche y quería regalarte este, quiero que sepas que te amo, y mucho! me daría algo de vergüenza decirte todo esto con mi voz, decidí escribirtelo todo acá para que lo leas, mi Melcita." },

    { title: "Monedero",
      text:  "Es adorable como vos; pero todavía no lo abras. Guardé dos regalos más dentro, pero no sé si te van a agradar, mi Melcita. Si te agradan, yo sería el más feliz del mundo." },

    { title: "Mi melcita",
      text:  "Espero que te esté gustando <3. Quise hacer algo lindo con mucho amor y quiero que recuerdes que sos muy especial para mí. Otra cosa, si notaste que los listones de la bolsita están medio chuecos o no quedaron perfectos, es porque los hice yo con todo mi amor y nunca había hecho algo así xd." }
  ]
};

/* =========================================================
   LÓGICA — no hace falta editar de acá para abajo
   ========================================================= */

const $ = (id) => document.getElementById(id);
const { texts, options, messages } = CONFIG;

/** Mezcla un array con Fisher-Yates y devuelve una copia nueva. */
function shuffle(list) {
  const arr = [...list];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Mazo de mensajes: se baraja una vez y se reparte uno por carta.
   Con avoidRepeats activado, ningún mensaje se repite hasta agotar el mazo. */
let deck = shuffle(messages);

/** Devuelve un mensaje al azar según la opción avoidRepeats. */
function drawMessage() {
  if (!options.avoidRepeats) {
    return messages[Math.floor(Math.random() * messages.length)];
  }
  if (deck.length === 0) deck = shuffle(messages); // Mazo agotado: se rebaraja
  return deck.pop();
}

/* ---------- Textos fijos ---------- */
$("title").textContent = texts.pageTitle;
$("subtitle").textContent = texts.subtitle;
$("close-btn").textContent = texts.closeButton;
document.title = texts.pageTitle.replace(/[^\p{L}\p{N}\s]/gu, "").trim();

/* ---------- Construcción de los sobres ---------- */
const total = Math.min(options.envelopeCount, messages.length);
let openedCount = 0;
let lastFocused = null;

for (let i = 0; i < total; i++) {
  const btn = document.createElement("button");
  btn.className = "envelope";
  btn.setAttribute("aria-label", texts.envelopeLabel);
  btn.innerHTML = `
    <span class="body"></span>
    <span class="paper"></span>
    <span class="flap"></span>
    <span class="seal">${texts.sealSymbol}</span>`;
  btn.addEventListener("click", () => openEnvelope(btn));
  $("grid").appendChild(btn);
}

/* ---------- Abrir una carta ---------- */
function openEnvelope(btn) {
  lastFocused = btn;

  // Si ya fue abierta, se vuelve a mostrar su mismo mensaje
  if (!btn._message) {
    btn._message = drawMessage();
    btn.classList.add("is-open");
    openedCount++;
  }

  // Pequeña pausa para que se vea la animación de la solapa
  setTimeout(() => showLetter(btn._message), 450);
}

/** Muestra el mensaje en la ventana emergente. */
function showLetter(msg) {
  $("letter-title").textContent = msg.title || "";
  $("letter-title").hidden = !msg.title;
  $("letter-text").textContent = msg.text;
  $("letter-signature").textContent = texts.signature;
  $("overlay").classList.add("is-visible");
  $("close-btn").focus();
}

/** Cierra la ventana y marca la carta como leída. */
function closeLetter() {
  $("overlay").classList.remove("is-visible");
  if (lastFocused) {
    lastFocused.classList.add("is-read");
    lastFocused.focus();
  }
  // Aviso final cuando se abrieron todas las cartas
  if (openedCount === total) $("done").textContent = texts.allRead;
}

/* ---------- Eventos de cierre ---------- */
$("close-btn").addEventListener("click", closeLetter);
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeLetter(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("overlay").classList.contains("is-visible")) closeLetter();
});
</script>
</body>
</html>
