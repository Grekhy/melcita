<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c5a3ff">
<meta name="description" content="Cartas y escritos para mi Melcita.">
<title>Para mi Melcita</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9C%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#inicio" aria-label="Ir al inicio">
    <span class="brand-mark" aria-hidden="true">♥</span>
    <span class="brand-text">Para mi Melcita</span>
  </a>
  <nav class="nav" aria-label="Secciones">
    <a href="#inicio" data-nav="inicio">Inicio</a>
    <a href="#cartas" data-nav="cartas">Cartas</a>
    <a href="#escritos" data-nav="escritos">Escritos</a>
    <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false" aria-label="Activar música" title="Música suave">
      <span class="music-toggle-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </span>
      <span class="music-bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
  </nav>
</header>

<main id="contenido">

  <!-- ==================== INICIO ==================== -->
  <section class="view" data-view="inicio" aria-label="Inicio">
    <div class="hero">
      <div class="hero-seal" aria-hidden="true">♥</div>
      <p class="eyebrow" id="home-eyebrow"></p>
      <h1 class="hero-title" id="home-title"></h1>
      <p class="hero-sub" id="home-subtitle"></p>
    </div>

    <div class="gifts">
      <a class="gift" href="#cartas">
        <div class="gift-top">
          <span class="gift-number" id="gift-letters-number"></span>
          <span class="gift-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <rect x="6.5" y="12.5" width="35" height="24" rx="4" stroke="currentColor" stroke-width="1.8"/>
              <path d="M8 15l16 12 16-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M24 33.5s-4.6-2.9-4.6-5.7a2.7 2.7 0 014.6-1.9 2.7 2.7 0 014.6 1.9c0 2.8-4.6 5.7-4.6 5.7z" fill="currentColor" opacity=".85"/>
            </svg>
          </span>
        </div>
        <h2 id="gift-letters-title"></h2>
        <p id="gift-letters-desc"></p>
        <span class="gift-cta"><span id="gift-letters-cta"></span> <span class="arrow" aria-hidden="true">→</span></span>
      </a>

      <a class="gift" href="#escritos">
        <div class="gift-top">
          <span class="gift-number"><span id="gift-writings-number"></span> <span class="gift-badge" id="new-badge"></span></span>
          <span class="gift-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M12 7.5h17l8 8v25H12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M29 7.5v8h8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M17 23h14M17 29h14M17 35h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M33 20.5l5.5-5.5 3 3-5.5 5.5-4 1 1-4z" fill="currentColor" opacity=".85"/>
            </svg>
          </span>
        </div>
        <h2 id="gift-writings-title"></h2>
        <p id="gift-writings-desc"></p>
        <span class="gift-cta"><span id="gift-writings-cta"></span> <span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </div>

    <p class="home-note" id="home-note"></p>
  </section>

  <!-- ==================== CARTAS ==================== -->
  <section class="view" data-view="cartas" aria-label="Las cartas">
    <div class="letters">
      <header class="section-head">
        <p class="eyebrow" id="letters-eyebrow"></p>
        <h1 id="letters-title"></h1>
        <p class="section-sub" id="letters-subtitle"></p>
      </header>
      <div class="grid" id="grid"></div>
      <p class="done" id="done" aria-live="polite"></p>
    </div>
  </section>

  <!-- ==================== ESCRITOS ==================== -->
  <section class="view" data-view="escritos" aria-label="Escritos">
    <div class="writings">
      <aside class="writings-aside">
        <p class="eyebrow" id="writings-eyebrow"></p>
        <h1 id="writings-title"></h1>
        <p class="section-sub" id="writings-subtitle"></p>
        <p class="writings-count" id="writings-count" aria-live="polite"></p>
      </aside>
      <div class="writings-list" id="writings-list"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p class="hand" id="footer-text"></p>
  <p class="tiny" id="footer-small"></p>
</footer>

<!-- Ventana de una carta -->
<div class="overlay" id="letter-overlay" role="dialog" aria-modal="true" aria-labelledby="letter-title" aria-hidden="true">
  <article class="letter">
    <h2 id="letter-title"></h2>
    <p id="letter-text"></p>
    <p class="signature" id="letter-signature"></p>
    <div class="actions">
      <button class="btn" id="close-btn" type="button"></button>
    </div>
  </article>
</div>

<!-- Lector de escritos -->
<div class="overlay reader-overlay" id="writing-overlay" role="dialog" aria-modal="true" aria-labelledby="writing-title" aria-hidden="true">
  <article class="reader" id="reader" tabindex="-1">
    <button class="reader-close" id="reader-close" type="button">✕</button>
    <p class="reader-kicker" id="writing-kicker"></p>
    <h2 id="writing-title"></h2>
    <div class="reader-body" id="writing-body"></div>
    <p class="reader-signature" id="writing-signature"></p>
    <div class="reader-nav">
      <button class="btn btn-ghost" id="prev-writing" type="button"><span aria-hidden="true">←</span> Anterior</button>
      <button class="btn" id="next-writing" type="button">Siguiente <span aria-hidden="true">→</span></button>
    </div>
  </article>
</div>

<audio id="music" src="assets/audio/melody.wav" loop preload="auto"></audio>

<script src="assets/js/app.js"></script>
</body>
</html>
